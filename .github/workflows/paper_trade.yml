name: Paper Trading 24/7

on:
  # Roda no inicio de cada hora, todos os dias
  schedule:
    - cron: "2 * * * *"   # 2 minutos apos a hora cheia (aguarda candle fechar)

  # Permite rodar manualmente pelo GitHub para testar
  workflow_dispatch:

jobs:
  run-agent:
    name: Decisao horaria do agente
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write   # necessario para commitar o log.csv atualizado

    steps:
      # 1. Baixa o repositorio completo (incluindo modelos e log)
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Configura Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Instala dependencias (usa cache do pip para ser rapido)
      - name: Instalar dependencias
        run: pip install -r crypto-agent/requirements.txt

      # 4. Roda o agente (1 decisao + atualiza log.csv)
      - name: Rodar agente
        working-directory: crypto-agent
        env:
          BINANCE_API_KEY:    ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: python paper_trading/runner.py

      # 5. Commita o log.csv atualizado de volta ao repositorio
      - name: Salvar log no repositorio
        run: |
          git config user.name  "paper-trading-bot"
          git config user.email "bot@paper-trading"
          git add crypto-agent/paper_trading/log.csv
          git diff --staged --quiet || git commit -m "log: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

  weekly-report:
    name: Relatorio semanal
    runs-on: ubuntu-latest
    # Toda segunda-feira as 08:00 UTC
    if: github.event_name == 'schedule' && contains(fromJSON('["1"]'), format('{0}', github.event.schedule))
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install pandas numpy

      - name: Gerar relatorio semanal
        working-directory: crypto-agent
        run: python paper_trading/report.py
